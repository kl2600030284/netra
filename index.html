<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Live mission control for KL University's campus rovers">
    <link rel="stylesheet" type="text/css" href="/style.css">
    <script src="/script.js"></script>
    <title>NETRA - Rover Monitor</title>
</head>
<body>
    <!-- ============================================= Header Section ============================================ -->
     
    <header class="topbar">

        <!-- =================================== Logo and Name =========================================== -->
            <div class="branding">
                <div class="brand-logo">N</div>
                <div class="brand-name">
                    <h1>NETRA</h1>
                    <p>Rover Monitoring System</p>
                </div>
            </div>

            <!-- ================================== Navbar =================================== -->
            
            <nav>
                <a href="#dashboard">Dashboard</a>
                <a href="#fleet">Fleet</a>
                <a href="#telemetry">Telemetry</a>
                <a href="#alerts">Alerts</a>
             </nav>

             <!-- ============================ System Status ============================== -->
             
             <div class="sys-status">
                <span class="online-dot"></span>
                <span><pre>System Online -</pre></span>
                <strong id="clock">--:--:--</strong>
              </div>

              <!-- ============================ Dispatch Button ======================================== -->
              
              <button id="dispatch-open" type="button">Dispatch Mission</button>              
</header>

         <!-- ============================================= Header Section ============================================ -->
<main class="page">

    <section class="kpi-grid">
    <article class="kpi-card">

        <span>ROVERS ONLINE</span>
        <h1 id="online-count">6/6</h1>
        <P>Active rover units</P>
    </article>

    <article class="kpi-card">
        <span>AVERAGE BATTERY</span>
        <h1 id="average-battery">85%</h1>
        <P>Fleet battery level</P>
    </article>

    <article class="kpi-card">
        <span>OPEN ALERTS</span>
        <h1 id="alert-count">6/6</h1>
        <P>Requires attention</P>
    </article>

    <article class="kpi-card">
        <span>DISTANCE TODAY</span>
        <h1 id="distance-today">12.5 km</h1>
        <P>Total distance covered</P>

    </article>
    </section>
</main>
</body>
</html>
